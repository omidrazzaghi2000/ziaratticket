# این فایل بارگذاری نمی‌شود.
# docker-compose.prod.yml آن را به /etc/nginx/ssl.conf.available وصل می‌کند
# (پسوند .available یعنی nginx آن را include نمی‌کند) و فقط به‌عنوان نسخه‌ی
# پشتیبان نگه داشته شده است. کانفیگ واقعی nginx/conf.d/default.conf است.
# محتوای زیر عیناً همان است تا دو نسخه‌ی متناقض در مخزن نماند.

# ziaratticket.ir دامنه‌ی اصلی است.
# karbalafori.ir فقط ۳۰۱ می‌دهد تا لینک‌های قدیمی و اعتبار موتورهای جست‌وجو
# از دست نرود؛ چالش ACME رویش باز مانده تا گواهی‌اش تمدید شود و این
# ریدایرکت روی https هم کار کند.

server {
    listen 80;
    server_name ziaratticket.ir www.ziaratticket.ir karbalafori.ir www.karbalafori.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ziaratticket.ir www.ziaratticket.ir;

    ssl_certificate /etc/letsencrypt/live/ziaratticket.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ziaratticket.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/conf.d/app-locations.inc;
}

# دامنه‌ی قدیمی — فقط انتقال به دامنه‌ی اصلی، با حفظ مسیر
server {
    listen 443 ssl;
    http2 on;
    server_name karbalafori.ir www.karbalafori.ir;

    ssl_certificate /etc/letsencrypt/live/karbalafori.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/karbalafori.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://ziaratticket.ir$request_uri;
    }
}
