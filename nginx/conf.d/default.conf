# دو دامنه هم‌زمان سرو می‌شوند تا جابه‌جایی DNS بدون قطعی انجام شود:
#   ziaratticket.ir  → دامنه‌ی اصلی (هدف)
#   karbalafori.ir   → دامنه‌ی فعلی، تا وقتی DNS منتقل شود
# بعد از اطمینان از انتقال، بلوک دوم به ریدایرکت ۳۰۱ تبدیل می‌شود.

server {
    listen 80;
    server_name ziaratticket.ir www.ziaratticket.ir karbalafori.ir www.karbalafori.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ziaratticket.ir www.ziaratticket.ir;

    ssl_certificate /etc/letsencrypt/live/ziaratticket.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ziaratticket.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/conf.d/app-locations.inc;
}

server {
    listen 443 ssl;
    http2 on;
    server_name karbalafori.ir www.karbalafori.ir;

    ssl_certificate /etc/letsencrypt/live/karbalafori.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/karbalafori.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/conf.d/app-locations.inc;
}
